<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>웨딩홀맵 — 전국 예식장 가격·후기 지도</title>
<meta name="description" content="전국 결혼식장을 카카오 지도 위에서 위치와 1인 식대·대관료로 확인하세요. 홀타입·시간대·가격으로 필터." />
<link rel="canonical" href="https://example.com/map.html" />
<meta property="og:type" content="website" />
<meta property="og:title" content="전국 웨딩홀 지도 — 식장 위치·가격" />
<meta property="og:locale" content="ko_KR" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
<script>
  // 카카오 지도 JavaScript 키 (공개 키 — 도메인 제한으로 보호됨). 비우면 히트맵으로 폴백.
  // 발급: developers.kakao.com → 내 애플리케이션 → 앱 키 → JavaScript 키
  // 도메인 등록 필수: 앱 → 플랫폼 → Web → 사이트 도메인에 https://ikdd7.github.io 추가
  window.KAKAO_JS_KEY = "5687b301b88c94b1d3bdefc562ee5310";
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="mapbody">

<div id="map"></div>
<div id="mapFallback"><div style="margin:auto;width:100%;max-width:420px"><div id="fbMap"></div></div></div>
<a id="mapLegal" href="/privacy.html" target="_blank" rel="noopener">약관·개인정보 · 정정/삭제 문의</a>

<div id="mapFabs">
  <button id="favOpen" class="fab favbtn" aria-label="내 찜·비교" title="내 찜·비교">
    <svg width="23" height="23" viewBox="0 0 24 24" fill="#d6336c"><path d="M12 20.5S3.5 15.4 3.5 9.4c0-2.6 2-4.4 4.3-4.4 1.7 0 3.2 1 4.2 2.5C13 6 14.5 5 16.2 5c2.3 0 4.3 1.8 4.3 4.4 0 6-8.5 11.1-8.5 11.1z"/></svg>
    <span id="favN" class="favbadge hide">0</span>
  </button>
  <button class="fab" onclick="window.__recenterMe&&window.__recenterMe()" aria-label="내 위치로" title="내 위치로">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3a4150" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="6"/>
      <circle cx="12" cy="12" r="1.6" fill="#3a4150" stroke="none"/>
      <line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/>
      <line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/>
    </svg>
  </button>
</div>

<div id="offlineBanner">🗺️ 카카오 지도를 불러오지 못해 ‘전국 히트맵’으로 표시 중이에요. (지도 키 설정/도메인 등록 후 표시)</div>

<div class="map-top">
  <div class="row1">
    <div class="brandwrap">
      <a class="ttl" href="wedding.html">웨딩홀맵</a>
    </div>
    <div class="msearch" id="msearch">
      <span class="qicon">🔍</span>
      <input id="qInput" type="text" placeholder="검색 (예: 강남, 엘타워)" autocomplete="off" />
      <div id="qResults" class="qresults"></div>
    </div>
  </div>
  <div class="mfilters">
    <button class="filterbtn" id="filterToggle">필터 <span class="fbcaret">▾</span></button>
    <div class="filtersummary" id="filterSummary"></div>
  </div>
  <div class="filterpanel" id="filterPanel">
    <div class="grp"><span class="glab">홀타입</span><span id="fType"></span></div>
    <div class="grp price">
      <span class="glab">가격대 <b id="fPlabel">전체</b></span>
      <div class="rangewrap">
        <div class="rangetrack"><div class="rangefill" id="fPfill"></div></div>
        <input type="range" id="fPmin" min="500" max="6000" step="100" value="500" aria-label="최소 예상총액" />
        <input type="range" id="fPmax" min="500" max="6000" step="100" value="6000" aria-label="최대 예상총액" />
      </div>
    </div>
    <div class="grp prefs"><span class="glab">선호</span><span id="fPref"></span></div>
    <div class="grp toggles">
      <button class="chip" id="fPriced">가격 있는 곳만</button>
    </div>
  </div>
</div>

<div id="favPanel" class="favpanel">
  <div class="fp-head"><b>💗 내 찜 · 비교</b><button id="favClose" class="fp-x" aria-label="닫기">×</button></div>
  <div class="fp-guests">하객 <input id="fpGuests" inputmode="numeric" maxlength="4" /> 명 기준 예상 총비용</div>
  <div id="fpList" class="fp-list"></div>
  <button id="fpShare" class="fp-share">📤 카톡으로 공유하기</button>
</div>

<script src="wedding-data.js"></script>
<script src="venues.pub.js"></script>
<script src="hub-stats.js"></script>
<script src="regions.js"></script>
<script src="stats.js"></script>
<script src="koreamap.js"></script>
<script src="map.js"></script>
</body>
</html>
