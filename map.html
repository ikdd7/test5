<body class="mapbody">

<div id="map"></div>
<div id="mapFallback"><div style="margin:auto;width:100%;max-width:420px"><div id="fbMap"></div></div></div>

<div id="mapFabs">
  <button class="fab" onclick="window.__recenterMe&&window.__recenterMe()" aria-label="내 위치로" title="내 위치로">📍</button>
</div>

<div id="offlineBanner">🗺️ 카카오 지도를 불러오지 못해 ‘전국 히트맵’으로 표시 중이에요. (지도 키 설정/도메인 등록 후 표시)</div>

<div class="map-top">
  <div class="row1">
    <a class="back" href="wedding.html">← 허브</a>
    <span class="ttl">🗺️ 전국 웨딩홀 지도</span>
    <a class="back" href="method.html" style="margin-left:auto">방법론</a>
  </div>
  <div class="msearch" id="msearch">
    <span class="qicon">🔍</span>
    <input id="qInput" type="text" placeholder="식장·지역 검색 (예: 엘타워, 강남, 부산)" autocomplete="off" />
    <div id="qResults" class="qresults"></div>
  </div>
  <div class="mfilters">
    <div class="grp"><span class="glab">홀타입</span><span id="fType"></span></div>
    <div class="grp"><button class="chip" id="fFav">💗 찜</button></div>
    <div class="grp"><button class="chip" id="fPriced">💰 가격있는 곳만</button></div>
    <div class="grp"><button class="chip" id="fVer">✅ 검증만</button></div>
  </div>
</div>

<div class="map-stats">
  <div class="n"><span id="mStatN">–</span><small>곳</small></div>
  <div><small>식대 중앙값</small> <b id="mStatMeal">–</b></div>
  <div><small>대관료 중앙값</small> <b id="mStatRent">–</b></div>
</div>

<button id="favOpen" class="favfab">💗 내 찜·비교 <span id="favN">0</span></button>

<div id="favPanel" class="favpanel">
  <div class="fp-head"><b>💗 내 찜 · 비교</b><button id="favClose" class="fp-x" aria-label="닫기">×</button></div>
  <div class="fp-guests">하객 <input id="fpGuests" inputmode="numeric" maxlength="4" /> 명 기준 예상 총비용</div>
  <div id="fpList" class="fp-list"></div>
  <button id="fpShare" class="fp-share">📤 카톡으로 공유하기</button>
</div>

<script src="wedding-data.js"></script>
<script src="venues.js"></script>
<script src="regions.js"></script>
<script src="stats.js"></script>
<script src="koreamap.js"></script>
<script src="map.js"></script>
