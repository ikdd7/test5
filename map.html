<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임플란트 가격 지도 | 내 주변 치과 가격 비교 (심평원 공개데이터)</title>
<meta name="description" content="심평원 비급여 공개데이터 기반 임플란트 가격 지도. 내 주변 치과의 임플란트 가격을 지도와 목록으로 비교하세요.">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  .layout { display:grid; grid-template-columns:1fr 1.3fr; gap:14px; }
  @media (max-width:760px){ .layout{ grid-template-columns:1fr; } #map{ height:340px; } }
  #map { height:520px; border-radius:14px; border:1px solid var(--line); z-index:0; }
  .controls { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .controls select { flex:1 1 auto; }
  .list { max-height:520px; overflow:auto; }
  .clinic { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; cursor:pointer; transition:.12s; }
  .clinic:hover { border-color:var(--brand); background:#f7faff; }
  .clinic .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .clinic .name { font-weight:700; font-size:15px; }
  .clinic .price { font-weight:800; color:var(--brand-dark); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .clinic .meta { color:var(--muted); font-size:13px; margin-top:2px; }
  .rank { display:inline-block; min-width:20px; color:var(--muted); font-size:13px; }
  .samplebar { background:#fffbeb; color:#92600a; border:1px solid #fde68a; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <span class="eyebrow">심평원 공개데이터 기반</span>
    <h1>임플란트 가격 지도</h1>
    <p>내 주변 치과의 임플란트 가격을 지도와 목록으로 비교하세요.</p>
    <p style="margin-top:12px">
      <a href="implant.html" style="color:#fff;font-weight:600">→ 임플란트 견적 진단기</a> &nbsp;·&nbsp;
      <a href="index.html" style="color:#fff;font-weight:600">보청기 진단기</a>
    </p>
  </div>
</header>

<main><div class="wrap">
  <div class="samplebar" id="samplebar"></div>

  <div class="controls">
    <select id="region"><option value="">전체 지역</option></select>
    <select id="sort">
      <option value="asc">가격 낮은 순</option>
      <option value="desc">가격 높은 순</option>
    </select>
  </div>

  <div class="layout">
    <div class="list" id="list"></div>
    <div id="map"></div>
  </div>

  <p class="disclaimer" id="foot" style="margin-top:14px"></p>
</div></main>

<footer><div class="wrap">
  <a href="implant.html">임플란트 진단기</a> · <a href="index.html">보청기</a> · 광고 아닌 실사용자 데이터를 지향합니다
</div></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };
  function won(n){ return (n||0).toLocaleString('ko-KR') + '원'; }

  var map = L.map('map').setView([36.5, 127.8], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '© OpenStreetMap'
  }).addTo(map);

  var markers = [], DATA = { items: [] };

  function render(){
    var region = $('#region').value, sort = $('#sort').value;
    var items = DATA.items.filter(function(c){ return !region || c.region === region; });
    items.sort(function(a,b){ return sort==='desc' ? b.implant-a.implant : a.implant-b.implant; });

    // 목록
    var list = $('#list'); list.innerHTML = '';
    items.forEach(function(c, i){
      var div = document.createElement('div');
      div.className = 'clinic';
      div.innerHTML = '<div class="top"><span class="name"><span class="rank">'+(i+1)+'.</span> '+c.name+'</span>'
        + '<span class="price">'+won(c.implant)+'</span></div>'
        + '<div class="meta">'+c.region+' · '+(c.material||'')+'</div>';
      div.addEventListener('click', function(){
        map.setView([c.lat, c.lng], 14);
        if (c._marker) c._marker.openPopup();
      });
      list.appendChild(div);
    });

    // 마커
    markers.forEach(function(m){ map.removeLayer(m); });
    markers = [];
    var bounds = [];
    items.forEach(function(c){
      var m = L.marker([c.lat, c.lng]).addTo(map)
        .bindPopup('<b>'+c.name+'</b><br>'+c.region+'<br>임플란트 <b>'+won(c.implant)+'</b><br>'+(c.material||''));
      c._marker = m; markers.push(m); bounds.push([c.lat, c.lng]);
    });
    if (bounds.length) map.fitBounds(bounds, { padding: [30,30], maxZoom: 13 });
  }

  function boot(data){
    DATA = data;
    // 지역 필터 채우기
    var regions = {}; data.items.forEach(function(c){ regions[c.region]=1; });
    var sel = $('#region');
    Object.keys(regions).sort().forEach(function(r){
      var o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o);
    });
    // 예시/실데이터 배너
    var isSample = data.items.some(function(c){ return c.sample; });
    $('#samplebar').textContent = isSample
      ? '⚠️ 현재는 예시(합성) 데이터입니다. 실제 치과·가격이 아니며, 심평원 공개데이터로 교체하면 실제 지도가 됩니다. (' + (data.asOf||'') + ')'
      : '심평원 비급여 공개데이터 기준 · 기준시점 ' + (data.asOf||'');
    $('#foot').textContent = '안내: ' + (data.source||'') + ' 가격은 헤드라인(식립+보철)이며 골이식·상악동거상술 등 추가비용은 별도입니다. 실제 결제가는 진단기 제보로 보정됩니다.';
    $('#region').addEventListener('change', render);
    $('#sort').addEventListener('change', render);
    render();
  }

  fetch('clinics.json').then(function(r){ return r.json(); })
    .then(boot)
    .catch(function(){
      // fetch 실패 시(파일 프로토콜 등) 최소 폴백
      boot({ asOf:'폴백', source:'clinics.json 로드 실패 — 예시 1건', items:[
        { name:'예시치과', region:'서울 강남구', addr:'', lat:37.4979, lng:127.0276, implant:1300000, material:'지르코니아', sample:true }
      ]});
    });
})();
</script>
</body>
</html>
