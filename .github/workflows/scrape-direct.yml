name: Scrape directwedding (전국 가격 수집)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "시작 hall 번호"
        default: "1"
      end:
        description: "끝 hall 번호 (한 번에 너무 많으면 나눠 실행)"
        default: "520"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/vibe-coding-revenue-page-k8dg72
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm i playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Scrape directwedding
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: node scrape-directwedding.js
      - name: Geocode new venues (좌표 없는 신규삽입분만)
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          ONLY_MISSING: "1"
        run: node geocode.js
      - name: Dedupe & rebuild & test
        run: |
          node dedupe.js
          node build.js
          node test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.js region/ sitemap.xml
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "directwedding 가격 수집 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/vibe-coding-revenue-page-k8dg72 || true
              if git rebase origin/claude/vibe-coding-revenue-page-k8dg72 && git push origin HEAD:claude/vibe-coding-revenue-page-k8dg72; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패(동시 변경)"; exit 1; }
          fi
