name: Scrape oding (스몰웨딩 가격)

# Actions 탭 → 이 워크플로 → "Run workflow"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/vibe-coding-revenue-page-k8dg72
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright + Chromium
        run: |
          npm i playwright@1.56.1 --no-save --no-package-lock
          npx playwright install --with-deps chromium
      - name: Scrape oding
        run: node scrape-oding.js
      - name: Geocode new venues (좌표 없는 신규삽입분만)
        continue-on-error: true
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          ONLY_MISSING: "1"
        run: node geocode.js
      - name: Dedupe & rebuild & test
        run: |
          node dedupe.js
          node build.js
          node test.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.js region/ sitemap.xml
          git checkout -- package.json package-lock.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "오딩 스몰웨딩 가격 수집 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/vibe-coding-revenue-page-k8dg72 || true
              if git rebase origin/claude/vibe-coding-revenue-page-k8dg72 && git push origin HEAD:claude/vibe-coding-revenue-page-k8dg72; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패(동시 변경)"; exit 1; }
          fi
