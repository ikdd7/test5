name: Geocode venues (카카오)

# 폰에서 Actions 탭 → 이 워크플로 → "Run workflow" 버튼으로 실행
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/vibe-coding-revenue-page-k8dg72
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Geocode venues.js
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: node geocode.js
      - name: Commit updated coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add venues.js
          if git diff --staged --quiet; then
            echo "변경 없음(좌표 동일)"
          else
            git commit -m "좌표 카카오 지오코딩 갱신 (Actions)"
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin claude/vibe-coding-revenue-page-k8dg72 || true
              if git rebase origin/claude/vibe-coding-revenue-page-k8dg72 && git push origin HEAD:claude/vibe-coding-revenue-page-k8dg72; then ok=1; break; fi
              git rebase --abort || true
              sleep $((i * 5))
            done
            [ "$ok" = 1 ] || { echo "push 실패(동시 변경)"; exit 1; }
          fi
